name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Playwright through the pilot week (docs/10 flows) with axe checks and the
    # p95 / 4G performance checks (docs/05, FR-21).
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parksmart/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  docker:
    # The production image must build (Dockerfile, pnpm deploy, native better-sqlite3).
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t parksmart:ci .
      - name: Image starts and reports healthy
        run: |
          docker run -d --name ps -p 3000:3000 \
            -e APP_URL=http://localhost:3000 \
            -e SESSION_SECRET=ci-session-secret-0123456789abcdefghijklmn \
            -e QR_SIGNING_SECRET=ci-qr-signing-secret-0123456789abcdefghij \
            -e ORG_EMAIL_DOMAIN=example.com \
            -e SSO_GOOGLE_CLIENT_ID=ci-client.apps.googleusercontent.com \
            -e SSO_GOOGLE_CLIENT_SECRET=ci-secret \
            -e SETUP_ORG_NAME="CI Org" -e SETUP_SITE_NAME="CI Site" \
            parksmart:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              docker logs ps 2>&1 | grep -q 'First-run setup created the org' && exit 0
            fi
            sleep 1
          done
          docker logs ps
          exit 1

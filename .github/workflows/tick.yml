name: Scheduled jobs

# ParkSmart on Vercel has no always-on server, so rounds, check-in deadlines, offer
# expiry and notifications run when /api/v1/cron/tick is called (ADR-016). Every job is
# idempotent: a late, missed or doubled call is safe. GitHub may start scheduled runs
# a few minutes late; Vercel's daily cron is a backstop.
#
# Repository settings → Secrets and variables → Actions:
#   PARKSMART_URL  e.g. https://parksmart.vercel.app (no trailing slash)
#   CRON_SECRET    the same value as CRON_SECRET in the Vercel project

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: parksmart-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/v1/cron/tick
        env:
          PARKSMART_URL: ${{ secrets.PARKSMART_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PARKSMART_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PARKSMART_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PARKSMART_URL/api/v1/cron/tick"
